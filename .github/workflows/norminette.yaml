name: Norminette

on:
  push:
    paths:
      - 'src/**'
      - 'inculude/**'

jobs:
  check-norminette:
    name: Norminette
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Norminette
        uses: 42School/norminette@3.3.60
        with:
          args:
            - 'src'
            - 'include'
