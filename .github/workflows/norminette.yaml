name: Norminette

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'

jobs:
  check-norminette:
    name: Norminette
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install norminette
        run: pip install norminette==3.3.60

      - name: Run norminette
        run: norminette src include
